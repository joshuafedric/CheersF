<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheers Award</title>
<style>
:root{
  --bg:#fdf3ee;
  --bg2:#ffe3d6;
  --ink:#3a241d;
  --muted:#b56a52;
  --accent:#e8492e;
  --line:rgba(232,73,46,.35);
  --panel:#ffffff;
}
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;
  background:
    linear-gradient(180deg,var(--bg2) 0%,var(--bg) 55%),
    repeating-linear-gradient(0deg,rgba(232,73,46,.08) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(232,73,46,.08) 0 1px,transparent 1px 34px);
  color:var(--ink);
  font-family:system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 24px;
}
.stage{
  position:relative;width:min(1100px,100%);aspect-ratio:16/9;
  border-radius:14px;overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(232,73,46,.18);
  background:var(--panel);
  touch-action:pan-y;
}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.85);color:var(--accent);
  font-size:22px;cursor:pointer;backdrop-filter:blur(4px);
}
.nav:hover{background:var(--accent);color:#fff}
.nav:focus-visible,.dot:focus-visible,.play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.prev{left:12px}.next{right:12px}
.bar{display:flex;align-items:center;gap:14px;margin-top:18px}
.dots{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:70vw}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--muted);background:transparent;cursor:pointer;padding:0}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.count{color:var(--muted);font-size:.9rem;min-width:3.5em;text-align:center}
.play{background:#fff;border:1px solid var(--line);color:var(--accent);border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.85rem;font-weight:600}
.play:hover{background:var(--accent);color:#fff}
@media(max-width:600px){.nav{width:38px;height:38px}.bar{flex-wrap:wrap;justify-content:center}}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" aria-roledescription="carousel" aria-label="Cheers Award winners">
  <div class="slide" role="group" aria-label="Slide 1"><img alt="Cheers Award slide 1" src="images/slide-1.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 2"><img alt="Cheers Award slide 2" src="images/slide-2.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 3"><img alt="Cheers Award slide 3" src="images/slide-3.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 4"><img alt="Cheers Award slide 4" src="images/slide-4.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 5"><img alt="Cheers Award slide 5" src="images/slide-5.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 6"><img alt="Cheers Award slide 6" src="images/slide-6.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 7"><img alt="Cheers Award slide 7" src="images/slide-7.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 8"><img alt="Cheers Award slide 8" src="images/slide-8.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 9"><img alt="Cheers Award slide 9" src="images/slide-9.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 10"><img alt="Cheers Award slide 10" src="images/slide-10.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 11"><img alt="Cheers Award slide 11" src="images/slide-11.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 12"><img alt="Cheers Award slide 12" src="images/slide-12.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 13"><img alt="Cheers Award slide 13" src="images/slide-13.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 14"><img alt="Cheers Award slide 14" src="images/slide-14.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 15"><img alt="Cheers Award slide 15" src="images/slide-15.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 16"><img alt="Cheers Award slide 16" src="images/slide-16.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 17"><img alt="Cheers Award slide 17" src="images/slide-17.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 18"><img alt="Cheers Award slide 18" src="images/slide-18.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 19"><img alt="Cheers Award slide 19" src="images/slide-19.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 20"><img alt="Cheers Award slide 20" src="images/slide-20.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 21"><img alt="Cheers Award slide 21" src="images/slide-21.jpg"></div>
  <div class="slide" role="group" aria-label="Slide 22"><img alt="Cheers Award slide 22" src="images/slide-22.jpg"></div>

  <button class="nav prev" id="prev" aria-label="Previous slide">&#8249;</button>
  <button class="nav next" id="next" aria-label="Next slide">&#8250;</button>
</div>

<div class="bar">
  <button class="play" id="play">Pause</button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
</div>

<script>
(function(){
var s=[].slice.call(document.querySelectorAll('.slide')),n=s.length,i=0,timer=null,playing=true;
var dots=document.getElementById('dots'),count=document.getElementById('count'),play=document.getElementById('play');

s.forEach(function(_,k){
  var b=document.createElement('button');
  b.className='dot';
  b.setAttribute('aria-label','Go to slide '+(k+1));
  b.onclick=function(){go(k,true)};
  dots.appendChild(b);
});
var d=[].slice.call(dots.children);

function go(k,manual){
  i=(k+n)%n;
  s.forEach(function(e,j){e.classList.toggle('on',j===i)});
  d.forEach(function(e,j){e.classList.toggle('on',j===i)});
  count.textContent=(i+1)+' / '+n;
  if(manual&&playing)start();
}
function start(){stop();timer=setInterval(function(){go(i+1)},5000)} // 5000ms = 5s per slide
function stop(){if(timer){clearInterval(timer);timer=null}}

document.getElementById('prev').onclick=function(){go(i-1,true)};
document.getElementById('next').onclick=function(){go(i+1,true)};
play.onclick=function(){playing=!playing;play.textContent=playing?'Pause':'Play';playing?start():stop()};

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')go(i-1,true);
  if(e.key==='ArrowRight')go(i+1,true);
});

var x0=null,st=document.getElementById('stage');
st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',function(e){
  if(x0===null)return;
  var dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>40)go(i+(dx<0?1:-1),true);
  x0=null;
});

if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;play.textContent='Play'}
go(0);if(playing)start();
})();
</script>
</body>
</html>
